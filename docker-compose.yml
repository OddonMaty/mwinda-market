services:
  postgres:
    image: postgres:17
    container_name: saotech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saotech_market
      POSTGRES_USER: saotech_user
      POSTGRES_PASSWORD: saotech_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
